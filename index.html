<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTracker AI</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --border-color: #334155;
      --button-bg: #0284c7;
      --button-hover: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Fixed Header Layout */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 600px;
      padding: 16px;
      background-color: #121824;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .menu-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 6px;
    }

    .menu-btn:hover {
      color: var(--text-main);
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-blue);
      white-space: nowrap;
      letter-spacing: -0.02em;
    }

    .brand-title .accent-text {
      color: #ffffff;
      margin-left: 2px;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      text-align: right;
    }

    /* Main Container */
    .main-container {
      width: 100%;
      max-width: 600px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Cards */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .exercise-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Form Controls */
    select {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .set-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .set-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      width: 35px;
    }

    .input-group {
      display: flex;
      flex: 1;
      gap: 8px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1rem;
      text-align: center;
      outline: none;
    }

    input[type="number"]::placeholder {
      color: var(--text-muted);
    }

    .btn-add-set {
      width: 100%;
      padding: 10px;
      background-color: transparent;
      border: 1px dashed var(--accent-blue);
      border-radius: 8px;
      color: var(--accent-blue);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add-set:hover {
      background-color: rgba(56, 189, 248, 0.1);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <button class="menu-btn" aria-label="Open Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="brand-title">
      FitTracker <span class="accent-text">AI</span>
    </div>

    <div class="status-badge">
      Local Mode
    </div>
  </header>

  <main class="main-container">
    
    <!-- Program Selector -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">Choose Program to Train</span>
      </div>
      <select id="program-select">
        <option value="push">Push Day</option>
        <option value="pull">Pull Day</option>
        <option value="legs">Legs Day</option>
      </select>
    </div>

    <!-- Exercise 1 -->
    <div class="card">
      <h2 class="exercise-title">Barbell Bench Press</h2>
      <div class="set-row">
        <span class="set-label">Set 1</span>
        <div class="input-group">
          <input type="number" placeholder="kg" class="input-kg">
          <input type="number" placeholder="reps" class="input-reps">
        </div>
      </div>
      <button class="btn-add-set">+ Add Set</button>
    </div>

    <!-- Exercise 2 -->
    <div class="card">
      <h2 class="exercise-title">Incline Dumbbell Press</h2>
      <div class="set-row">
        <span class="set-label">Set 1</span>
        <div class="input-group">
          <input type="number" placeholder="kg" class="input-kg">
          <input type="number" placeholder="reps" class="input-reps">
        </div>
      </div>
      <button class="btn-add-set">+ Add Set</button>
    </div>

    <!-- Exercise 3 -->
    <div class="card">
      <h2 class="exercise-title">Overhead Shoulder Press</h2>
      <div class="set-row">
        <span class="set-label">Set 1</span>
        <div class="input-group">
          <input type="number" placeholder="kg" class="input-kg">
          <input type="number" placeholder="reps" class="input-reps">
        </div>
      </div>
      <button class="btn-add-set">+ Add Set</button>
    </div>

  </main>

  <script>
    // LocalStorage Data Management
    document.querySelectorAll('input').forEach((input, index) => {
      const savedValue = localStorage.getItem(`input_${index}`);
      if (savedValue) {
        input.value = savedValue;
      }

      input.addEventListener('input', (e) => {
        localStorage.setItem(`input_${index}`, e.target.value);
      });
    });
  </script>

</body>
</html>
